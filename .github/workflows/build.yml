name: Build StardoPredict APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:- name: Build APK
            run: gradle --version
          name: StardoPredict-APK
          path: app/build/outputs/apk/debug/app-debug.apk
